[project]
name = "yolo26-model"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "ultralytics==8.4.174",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxslim==0.1.97",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pycocotools>=2.0.7",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools]
py-modules = []
